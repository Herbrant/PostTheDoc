[project]
name = "postthedoc"
version = "0.1.0"
description = "Email notifications about new academic job calls in Italian universities"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "selectolax>=0.3.21",
]

[project.scripts]
postthedoc = "postthedoc.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postthedoc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "PTH", "PT", "S", "TRY", "ANN", "RUF",
]
ignore = [
    "TRY003",  # messages built at the raise site are clear enough for this codebase
    "TRY400",  # expected network failures are logged without a traceback
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=postthedoc", "--cov-report=term-missing:skip-covered"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\."]
