<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostTheDoc</title>
  <meta name="description" content="Notifiche email sui nuovi bandi universitari italiani · Email notifications about new Italian academic job calls">
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body data-page="subscribe">
  <main class="container">
    <header>
      <h1><a href="/">PostTheDoc</a></h1>
      <nav class="lang" aria-label="Language">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
      </nav>
    </header>
    <p class="lead" data-i18n="lead"></p>

    <p id="message" class="message" hidden></p>

    <form id="subscribe" novalidate>
      <fieldset>
        <legend data-i18n="email"></legend>
        <input type="email" name="email" required autocomplete="email" data-i18n-placeholder="email_placeholder">
      </fieldset>
      <div id="prefs"><p data-i18n="loading"></p></div>
      <div id="turnstile"></div>
      <button type="submit" data-i18n="subscribe"></button>
      <p class="hint" data-i18n="subscribe_note"></p>
    </form>
  </main>
</body>
</html>
