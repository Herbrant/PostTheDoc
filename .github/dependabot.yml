version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/pipeline
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # astro check supports TypeScript up to 6.
      - dependency-name: typescript
        versions: [">=7"]
      # @cloudflare/vitest-plugin (the Worker's tests) requires Vitest 4.
      - dependency-name: vitest
        versions: [">=5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
