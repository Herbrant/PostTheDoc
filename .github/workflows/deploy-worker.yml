name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/**"
      - "package-lock.json"
      - "data/reference/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      # wrangler.jsonc holds a placeholder id: the real one comes from the secret also used by
      # daily.yml (wrangler does not read environment variables in its config).
      - name: D1 database id
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [[ ! "$D1_DATABASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::Set the D1_DATABASE_ID secret to the id printed by wrangler d1 create"
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc
      - name: D1 migrations
        run: npx wrangler d1 migrations apply postthedoc --remote
      # The sender address and the frontend URL are the same GitHub variables used by daily.yml
      # (and pages.yml), not part of wrangler.jsonc.
      - name: Deploy
        env:
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [[ ! "$SENDER_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+$ ]]; then
            echo "::error::Set the SENDER_EMAIL variable to the sender verified on Brevo"
            exit 1
          fi
          if [[ ! "$SITE_URL" =~ ^https://[^/[:space:]]+(/[^[:space:]]*)?$ ]]; then
            echo "::error::Set the SITE_URL variable to the public https URL of the frontend"
            exit 1
          fi
          vars=(--var "SENDER_EMAIL:$SENDER_EMAIL" --var "FRONTEND_URL:${SITE_URL%/}")
          npx wrangler deploy "${vars[@]}"
