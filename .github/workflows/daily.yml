name: Daily notifications

on:
  schedule:
    - cron: "0 6 * * *" # 08:00 Italian time (07:00 in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --no-dev

      - name: Fetch calls and send digests
        run: uv run postthedoc run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D1-only token if set, so that this job cannot deploy the Worker.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.API_URL }}

      # The daily commit also keeps the cron alive (GitHub disables it after 60 days of inactivity).
      - name: Save seen calls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || { git commit -m "chore: update seen calls"; git push; }
