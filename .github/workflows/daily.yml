name: Daily notifications

# Started every day at 10:00 Italian time by the Worker's cron trigger (apps/worker/wrangler.jsonc):
# GitHub's own schedule ran it hours late, or skipped it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No credentials left in .git/config: the step that runs the pipeline (and its dependencies)
      # holds every other secret, it does not need to push too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --frozen --no-dev
        working-directory: apps/pipeline

      - name: Fetch calls and send digests
        run: uv run --frozen --no-dev postthedoc run
        working-directory: apps/pipeline
        env:
          POSTTHEDOC_DATA: ${{ github.workspace }}/data
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D1-only token if set, so that this job cannot deploy the Worker.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.API_URL }}

      # Runs after a failed run too: seen.json then lists the calls to send again to whoever missed
      # them (a failed send, the Brevo quota), and the work of the healthy MUR sections is kept.
      # Rebased first: main may have moved during the run, or since a re-run's checkout.
      - name: Save seen calls
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -f data/seen.json ] || exit 0  # a first run that could not bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update seen calls"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
